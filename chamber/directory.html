<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibadan Chamber of Commerce - Member Directory</title>

    <!-- Favicon -->
    <link rel="icon" href="../images/ibadan-chamber-favicon.png" type="image/png">

    <!-- Meta Tags -->
    <meta name="description" content="Explore verified business members, corporate representatives, and leaders of the Ibadan Chamber of Commerce directory.">
    <meta name="author" content="Oludayo Oluboyede">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- Scripts with defer -->
    <script src="scripts/navigation.js" defer></script>
    <script src="scripts/date.js" defer></script>
    <script src="scripts/directory.js" defer></script>
</head>
<body>
    <header>
        <div class="logo-box">
            <img src="../images/IBCC.png" alt="Ibadan Chamber of Commerce Logo" width="44" height="44" class="site-logo">
            <span class="site-name">Ibadan Chamber</span>
        </div>
        <button id="menu-button" aria-label="Open Navigation Menu">&#9776;</button>
        <nav id="animate-nav">
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="discover.html">Discover</a></li>
                <li><a href="directory.html" class="active">Directory</a></li>
                <li><a href="join.html">Join</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Member Directory</h1>
        
        <!-- Grid / List View Toggle Buttons -->
        <div class="menu-select">
            <button id="grid" class="active">Grid View</button>
            <button id="list">List View</button>
        </div>

        <!-- Dynamic Member Container -->
        <div id="member-container" class="grid">
            <!-- JavaScript will dynamically inject members and representative details here from data/members.json -->
        </div>
    </main>

    <footer>
        <div class="footer-col">
            <h3>Ibadan Chamber of Commerce</h3>
            <p>Dugbe Commercial District</p>
            <p>Ibadan, Oyo State, Nigeria</p>
        </div>
        <div class="social-links">
            <a href="https://www.linkedin.com" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                <img src="../images/linkedin.svg" alt="" width="24" height="24">
            </a>
            <a href="https://github.com" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <img src="../images/github.svg" alt="" width="24" height="24">
            </a>
            <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)">
                <img src="../images/twitter.svg" alt="" width="24" height="24">
            </a>
        </div>
        <div class="footer-bottom">
            <p>&copy; <span id="currentyear"></span> Oludayo Oluboyede • Ibadan Chamber of Commerce</p>
            <p id="lastModified"></p>
        </div>
    </footer>
</body>
</html>
